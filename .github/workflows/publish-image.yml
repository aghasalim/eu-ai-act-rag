name: publish-image

# Builds the container in GitHub's network and publishes it to GHCR. Doing this
# in CI rather than from a laptop avoids pushing a 2.8 GB image over a home
# connection, and means the published image can never drift from main.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - src/**
      - app/**
      - data/raw/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner ships ~30 GB of preinstalled toolchains this build never
      # touches; torch plus the layer cache needs the room.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # linux/amd64 only: that is what Hugging Face Spaces and most cloud hosts
      # run. arm64 would need QEMU emulation for the torch install, which is far
      # too slow to be worth it: build locally with `make docker` on Apple
      # Silicon instead.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          docker run -d --name smoke -p 8501:8501 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8501/_stcore/health >/dev/null; then break; fi
            sleep 5
          done
          curl -sf http://localhost:8501/_stcore/health
          docker exec smoke python -c "
          import sys; sys.path.insert(0,'/app')
          from src.euactrag import pipeline
          a = pipeline.answer('Is an AI system used to filter job applications high-risk?', k=4)
          assert 'anx_III' in a.retrieved_units, a.retrieved_units
          print('retrieval OK:', a.retrieved_units)
          "
