[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euactrag"
dynamic = ["version"]
description = "Question answering over the EU AI Act (Regulation (EU) 2024/1689), cited to the paragraph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aghasalim Mustafazada" }]
keywords = ["eu ai act", "rag", "retrieval", "legal", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]
# Same core as requirements.txt, without the app and the Linux-only sqlite shim.
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5,<0.7",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]

[project.scripts]
euactrag = "euactrag.cli:main"

[project.urls]
Homepage = "https://github.com/aghasalim/eu-ai-act-rag"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["euactrag"]

[tool.setuptools.dynamic]
version = { attr = "euactrag.__version__" }
